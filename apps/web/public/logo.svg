<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Lumio Logo - Generated from p5.js sketch -->

  <!-- Colors: Amber #FFA726, Coral #FF7061, Violet #9C68D4 -->

  <!-- Core circle - 3 color segments (pie wedges) -->
  <!-- Amber segment: -90° to 30° -->
  <path d="M 200 200 L 200 120 A 80 80 0 0 1 269.28 240 Z" fill="#FFA726"/>

  <!-- Coral segment: 30° to 150° -->
  <path d="M 200 200 L 269.28 240 A 80 80 0 0 1 130.72 240 Z" fill="#FF7061"/>

  <!-- Violet segment: 150° to 270° (-90°) -->
  <path d="M 200 200 L 130.72 240 A 80 80 0 0 1 200 120 Z" fill="#9C68D4"/>

  <!-- 3 geometric rays -->
  <!-- Amber ray: pointing up (-90°) -->
  <rect x="95" y="-12" width="45" height="24" rx="6" fill="#FFA726" transform="translate(200, 200) rotate(-90)"/>

  <!-- Coral ray: pointing 30° -->
  <rect x="95" y="-12" width="45" height="24" rx="6" fill="#FF7061" transform="translate(200, 200) rotate(30)"/>

  <!-- Violet ray: pointing 150° -->
  <rect x="95" y="-12" width="45" height="24" rx="6" fill="#9C68D4" transform="translate(200, 200) rotate(150)"/>

  <!-- Signature line -->
  <line x1="100" y1="330" x2="300" y2="330" stroke="#282828" stroke-width="6" stroke-linecap="round"/>
</svg>
