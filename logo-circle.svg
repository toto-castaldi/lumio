<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- Lumio Logo with white circle background -->

  <!-- White circle background -->
  <circle cx="200" cy="200" r="200" fill="white"/>

  <!-- Colors: Amber #FFA726, Coral #FF7061, Violet #9C68D4 -->

  <!-- Pie chart centered at (200,200), radius 140 for good fill -->
  <!-- Amber segment: -90° to 30° (top-right) -->
  <path d="M 200 200 L 200 60 A 140 140 0 0 1 321.2 270 Z" fill="#FFA726"/>

  <!-- Coral segment: 30° to 150° (bottom) -->
  <path d="M 200 200 L 321.2 270 A 140 140 0 0 1 78.8 270 Z" fill="#FF7061"/>

  <!-- Violet segment: 150° to 270° (top-left) -->
  <path d="M 200 200 L 78.8 270 A 140 140 0 0 1 200 60 Z" fill="#9C68D4"/>
</svg>
