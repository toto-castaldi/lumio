<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Lumio Logo Mark — pie chart only, no rays -->
  <!-- Colors: Amber #FFA726, Coral #FF7061, Violet #9C68D4 -->

  <!-- Amber segment: -90° to 30° (top-right) -->
  <path d="M 100 100 L 100 10 A 90 90 0 0 1 177.9 145 Z" fill="#FFA726"/>

  <!-- Coral segment: 30° to 150° (bottom) -->
  <path d="M 100 100 L 177.9 145 A 90 90 0 0 1 22.1 145 Z" fill="#FF7061"/>

  <!-- Violet segment: 150° to 270° (top-left) -->
  <path d="M 100 100 L 22.1 145 A 90 90 0 0 1 100 10 Z" fill="#9C68D4"/>
</svg>
