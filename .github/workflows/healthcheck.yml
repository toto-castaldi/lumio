# healthcheck.yml — OPS-01 + OPS-03 external healthcheck (LIVE)
#
# MATERIALIZED from the template that lives in the private self-hosting repo at
#     .github/workflows/healthcheck.example.yml
# Edit the template first, then re-materialize here — otherwise the two drift and the
# runbook (docs/site-healthcheck-runbook.md, same repo) stops describing reality.
# All real values come from GH Actions secrets; none are committed in either copy.

name: site healthcheck

on:
  schedule:
    # GH enforces a 5-minute MINIMUM; ~15 min is reliable + low-noise. Expect 5-30 min jitter.
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

# No checkout needed → minimal token surface (public-repo Actions hardening).
permissions:
  contents: none

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Probe targets and alert on failure
        env:
          # All real values come from GH Actions secrets in the SOURCE repo — never committed.
          # TARGETS: space-separated full URLs, optionally `url|expected_status|body_marker`
          # (and a 4th field, `|probe_token`, for the readiness rung below). Defaults:
          # expected_status=200, body_marker empty, probe_token empty. A body_marker cannot
          # contain a space — the list itself is space-separated.
          TARGETS: ${{ secrets.HEALTHCHECK_TARGETS }}
          BREVO_KEY: ${{ secrets.BREVO_API_KEY }}       # Brevo transactional api-key
          ALERT_TO: ${{ secrets.ALERT_RECIPIENT }}      # operator inbox
          ALERT_FROM: ${{ secrets.ALERT_SENDER }}       # DKIM/DMARC-authenticated Brevo sender
        run: |
          set -u
          fail=""
          for spec in $TARGETS; do
            # Split "url|want|marker|token" left to right. Each `[ "$a" = "$b" ]` test means
            # "this field was absent, because the expansion left the string unchanged".
            url=${spec%%|*}; rest=${spec#*|}
            want=${rest%%|*}; [ "$want" = "$spec" ] && want=200
            rest2=${rest#*|}; [ "$rest2" = "$rest" ] && rest2=""
            marker=${rest2%%|*}
            token=${rest2#*|}; [ "$token" = "$rest2" ] && token=""
            # A token here is NEVER a credential — it is a deliberately invalid literal, and
            # that is the whole point. Docora's onRequest auth hook queries Postgres BEFORE
            # routing, so 401 "Invalid token" proves the datastore answered, while 5xx proves
            # the API is alive but the datastore is not. /health cannot make that distinction:
            # it returns process uptime and never touches Postgres.
            auth=()
            [ -n "$token" ] && auth=(-H "Authorization: Bearer $token")
            # `|| true` is LOAD-BEARING: GH Actions runs steps under `bash -eo pipefail`, so a
            # DNS/connection failure (curl exit 6/7/28 — exactly the "jarvis/tunnel down" case)
            # would otherwise ABORT the step before we can alert, i.e. the check would fail
            # silently in precisely the case it exists for. This is the Phase 9 bug. Do not
            # remove it. curl still writes %{http_code} (000 when there is no HTTP response at
            # all); anything that is not the expected status, 000 included, is treated as DOWN.
            out=$(curl -sS -w '\n%{http_code}' \
              --max-time 20 --retry 2 --retry-delay 5 "${auth[@]}" "$url" || true)
            code=$(printf '%s' "$out" | tail -n1)
            body=$(printf '%s' "$out" | sed '$d')
            [ -n "$code" ] || code="000"
            if [ "$code" != "$want" ]; then fail="$fail $url(=$code)"; continue; fi
            # Status alone is not a strong enough assertion: a Cloudflare Access 302, a CF
            # error page or an "always online" cache can satisfy a status-only check while the
            # thing behind it is gone. Phase 15 measured this — asserting on the status alone
            # "would have produced a false green on the most important security check of the
            # window". So an expected status may be paired with a required body marker.
            if [ -n "$marker" ] && ! printf '%s' "$body" | grep -q "$marker"; then
              fail="$fail $url(body!~$marker)"
            fi
          done
          if [ -z "$fail" ]; then
            echo "all up"
            exit 0
          fi
          echo "DOWN:$fail"
          # On failure, POST a Brevo transactional email. The api-key is a header, never echoed.
          # Capture + echo the Brevo HTTP status + body (messageId on success; never the key) so a
          # rejected send (e.g. unverified sender, bad key) is visible in the run log instead of a
          # silent no-mail. `|| true` keeps the intentional `exit 1` (red run) as the last word.
          resp=$(curl -sS -w '\nHTTP:%{http_code}' -X POST https://api.brevo.com/v3/smtp/email \
            -H "api-key: $BREVO_KEY" \
            -H 'content-type: application/json' \
            -d "{\"sender\":{\"email\":\"$ALERT_FROM\"},\"to\":[{\"email\":\"$ALERT_TO\"}],\"subject\":\"[jarvis] site DOWN:$fail\",\"textContent\":\"Healthcheck first-failed-observation for:$fail\"}" || true)
          echo "brevo-response: $resp"
          exit 1
